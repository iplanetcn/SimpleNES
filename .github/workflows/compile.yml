name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        build_type: [Release, Debug]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install SFML 3 (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libxrandr-dev libxcursor-dev libxi-dev libudev-dev libfreetype-dev libgl1-mesa-dev xvfb
          git clone --depth 1 --branch 3.0.2 https://github.com/SFML/SFML.git "$RUNNER_TEMP/sfml"
          cmake -S "$RUNNER_TEMP/sfml" -B "$RUNNER_TEMP/sfml-build" -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX="$RUNNER_TEMP/sfml-install" -DSFML_BUILD_AUDIO=OFF -DSFML_BUILD_NETWORK=OFF
          cmake --build "$RUNNER_TEMP/sfml-build" --parallel
          cmake --install "$RUNNER_TEMP/sfml-build"
          echo "CMAKE_PREFIX_PATH=$RUNNER_TEMP/sfml-install" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=$RUNNER_TEMP/sfml-install/lib" >> "$GITHUB_ENV"

      - name: Install SFML 3 (macOS)
        if: runner.os == 'macOS'
        run: brew install sfml

      - name: Install SFML 3 (Windows)
        if: runner.os == 'Windows'
        run: vcpkg install sfml:x64-windows

      - name: Configure (Linux / macOS)
        if: runner.os != 'Windows'
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}

      - name: Configure (Windows)
        if: runner.os == 'Windows'
        run: cmake -S . -B build -DCMAKE_TOOLCHAIN_FILE=C:/vcpkg/scripts/buildsystems/vcpkg.cmake -DVCPKG_TARGET_TRIPLET=x64-windows

      - name: Build
        run: cmake --build build --config ${{ matrix.build_type }} --parallel

      - name: Smoke test (Linux / macOS)
        if: runner.os != 'Windows'
        working-directory: build
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            xvfb-run -a ./SimpleNES --help
          else
            ./SimpleNES --help
          fi

      - name: Smoke test (Windows)
        if: runner.os == 'Windows'
        working-directory: build
        run: ./${{ matrix.build_type }}/SimpleNES.exe --help

      - uses: actions/upload-artifact@v4
        if: matrix.build_type == 'Release'
        with:
          name: SimpleNES-${{ runner.os }}
          path: |
            build/SimpleNES
            build/Release/*.exe
            build/Release/*.dll
            build/keybindings.conf
